<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#faf6f0;color:#1e293b}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#d9b98a;border-radius:10px}
.card-shadow{box-shadow:0 10px 25px -5px rgba(109,15,38,.08)}
.hs::-webkit-scrollbar{display:none}.hs{scrollbar-width:none}
.nv{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;border-radius:1rem;color:rgba(255,255,255,.85);font-weight:500;width:100%}
.nv:hover{background:rgba(255,255,255,.1);color:#fff}
.on{background:#fff!important;color:#6d0f26!important;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.inp{width:100%;padding:.6rem;border:1px solid #e2e8f0;border-radius:.75rem;font-size:12px;font-weight:400;color:#1e293b}
.inp:focus{outline:2px solid #9b1c3a}
.lb{display:block;font-weight:700;color:#475569;font-size:12px}.lb .inp{margin-top:4px}
.btn-p{background:#6d0f26;color:#fff;font-weight:700;font-size:12px;padding:.6rem 1rem;border-radius:1rem}.btn-p:hover{background:#570c1e}
.btn-g{background:#f1f5f9;color:#475569;font-weight:700;font-size:12px;padding:.6rem 1rem;border-radius:1rem}
.ic{padding:.5rem;border-radius:.75rem}.ic:hover{background:#f1f5f9}
.cal-on{background:#6d0f26;color:#fff;font-weight:700}

<body class="h-full overflow-hidden text-sm antialiased">
<div id="toasts" class="fixed top-5 right-5 z-[80] flex flex-col gap-2 pointer-events-none"></div>

<div id="loginScreen" class="fixed inset-0 z-50 bg-brand-600 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-5">
    <div class="text-center space-y-2">
      <img class="logo w-24 h-24 mx-auto rounded-full shadow-md" alt="Logo">
      <h2 class="text-xl font-extrabold text-brand-600">Klinik Gigi Simply Smiles Dental</h2>
      <p class="text-xs text-slate-400">Sistem Manajemen Admin & Operasional Klinik</p>
    </div>
    <form onsubmit="login(event)" class="space-y-4">
      <label class="lb">Username / ID Admin<input class="inp py-3" value="admin_alisha" required></label>
      <label class="lb">Kata Sandi<input type="password" class="inp py-3" value="123456" required></label>
      <button class="btn-p w-full py-3.5">Masuk ke Dashboard Admin</button>
    </form>
    <button onclick="login()" class="w-full py-2.5 bg-gold-100 hover:bg-gold-300 text-brand-700 rounded-2xl font-bold text-xs"><i class="fa-solid fa-bolt mr-1"></i> Bypass Masuk Mode Demo Admin</button>
  </div>
</div>

<div id="mainApp" class="flex h-screen overflow-hidden p-3 md:p-5 gap-4 hidden">
  <aside class="w-20 md:w-64 bg-brand-600 rounded-3xl flex flex-col justify-between p-4 text-white shadow-xl flex-shrink-0">
    <div>
      <div class="flex items-center gap-3 px-1 py-2 mb-4">
        <img class="logo w-11 h-11 rounded-full border-2 border-gold-400" alt="Logo">
        <div class="hidden md:block"><h1 class="font-bold text-sm leading-tight">Simply Smiles</h1><p class="text-[11px] text-gold-400 tracking-wider uppercase font-semibold">Dental</p></div>
      </div>
      <nav id="nav" class="space-y-1 overflow-y-auto max-h-[calc(100vh-230px)] hs"></nav>
    </div>
    <div class="border-t border-white/20 pt-3 space-y-1">
      <a href="#" onclick="openSyncModal()" class="nv bg-gold-400/20 text-gold-300 text-xs font-semibold"><i class="fa-solid fa-table-cells w-5 text-center"></i><span class="hidden md:inline">Integrasi Google Sheets</span></a>
      <button onclick="logout()" class="nv"><i class="fa-solid fa-right-from-bracket w-5 text-center"></i><span class="hidden md:inline">Keluar Admin</span></button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col h-full overflow-hidden min-w-0">
    <header class="flex items-center justify-between pb-4 pt-1 gap-3 flex-shrink-0">
      <div class="relative w-72 md:w-96 max-w-full">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input id="gs" oninput="Q=this.value.trim().toLowerCase();render()" class="w-full pl-11 pr-4 py-2.5 rounded-2xl bg-white card-shadow text-xs focus:outline-2 focus:outline-brand-500 disabled:bg-slate-100 disabled:cursor-not-allowed">
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openSyncModal()" class="hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-2xl bg-white card-shadow font-bold text-xs text-slate-700"><i class="fa-solid fa-table-cells text-emerald-600"></i> Google Sheets</button>
        <button onclick="go('notifikasi')" class="w-10 h-10 rounded-2xl bg-white card-shadow text-slate-600 relative"><i class="fa-solid fa-bell"></i><span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-red-500"></span></button>
        <button onclick="go('pengaturan')" class="w-10 h-10 rounded-2xl bg-white card-shadow text-slate-600"><i class="fa-solid fa-gear"></i></button>
        <button onclick="toggleRight()" class="xl:hidden w-10 h-10 rounded-2xl bg-brand-600 text-white"><i class="fa-solid fa-calendar-days"></i></button>
      </div>
    </header>
    <div class="flex-1 flex gap-4 overflow-hidden">
      <div id="content" class="flex-1 overflow-y-auto pr-1 hs space-y-4"></div>
      <aside id="right" class="hidden xl:flex w-80 bg-white rounded-3xl p-5 card-shadow flex-col overflow-y-auto hs flex-shrink-0"></aside>
    </div>
  </main>
</div>

<div id="modal" onclick="if(event.target===this)closeModal()" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden">
  <div id="mbody" class="bg-white rounded-3xl p-6 shadow-2xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto"></div>
</div>

function coerce(c,o){const s=(initialData[c]&&initialData[c][0])||{},r={};
 for(const k in o){const v=o[k],t=typeof s[k];r[k]=t==='number'?(v===''?0:Number(v)):t==='boolean'?(v===true||v==='true'||v==='TRUE'):v}return r}
async function sheetCall(opts){const r=await fetch(sheetUrl,opts),t=await r.text();let j;
 try{j=JSON.parse(t)}catch(e){throw new Error('Google membalas bukan data (status '+r.status+'). Pastikan deployment: Eksekusi sebagai Saya, Akses Siapa saja, dan sudah Versi baru.')}
 if(!j.ok)throw new Error(j.error||'Respon tidak valid');return j}
async function syncPush(){if(!sheetUrl)return;setSync('busy','Menyimpan ke Google Sheet...');
 try{await sheetCall({method:'POST',body:JSON.stringify({action:'sync',db:getDB()})});setSync('ok','Tersimpan di Google Sheet')}catch(e){setSync('err','Gagal simpan: '+e.message)}}
async function syncPull(){if(!sheetUrl)return;setSync('busy','Memuat dari Google Sheet...');
 try{const j=await sheetCall({}),remote=j.db||{};
  const kosong=Object.keys(initialData).filter(k=>k!=='pengaturan').every(k=>!(remote[k]&&remote[k].length));
  if(kosong){await syncPush();setSync('ok','Sheet masih kosong: data awal dikirim')}
  else{const db={},local=getDB();let seed=false,lama=[];
   for(const k in initialData){
    if(k==='pengaturan')db[k]=Object.keys(remote[k]||{}).length?remote[k]:initialData[k];
    else if(NEWK.includes(k)&&remote[k]===undefined){db[k]=local[k];lama.push(k)}
    else{let a=(remote[k]||[]).map(o=>coerce(k,o));if(!a.length&&NEWK.includes(k)&&local[k]&&local[k].length){a=local[k];seed=true}db[k]=a}}
   const ch=mig(db);localStorage.setItem('dentalClinicDB',JSON.stringify(db));
   if(lama.length)setSync('err','Apps Script belum diperbarui (tab jadwal belum ada). Tempel Code.gs terbaru lalu Deploy versi baru.');
   else if(seed||ch)await syncPush();else setSync('ok','Tersinkron dengan Google Sheet')}
  if(!$('mainApp').classList.contains('hidden')&&$('modal').classList.contains('hidden'))render()
 }catch(e){setSync('err','Gagal: '+e.message)}}

  rows=HARI.map(h=>{const sh=['Shift 1','Shift 2'].concat(a.some(x=>x.hari===h&&String(x.shift).startsWith('Panggilan'))?['Panggilan']:[]);
   return sh.map((k,i)=>`<tr>${i?'':`<td rowspan="${sh.length}" class="p-3 font-extrabold text-brand-600 border border-slate-100 align-top">${h.toUpperCase()}</td>`}<td class="p-2 border border-slate-100 font-semibold whitespace-nowrap">${k}${JAM[k]&&JAM[k][0]?`<br><span class="text-[10px] text-slate-400 font-normal">${JAM[k][0]} - ${JAM[k][1]}</span>`:''}</td>${cell(h,k,'Standby')}${cell(h,k,'By Appointment')}</tr>`).join('')}).join('');
  return card(head('📅 Jadwal Praktik Mingguan Dokter','Standby dan By Appointment per shift, tersinkron ke Google Sheet',`<div class="flex gap-2"><button onclick="importJadwal()" class="btn-g">Muat Jadwal Asli</button>${addBtn('jadwalDokter','Tambah Jadwal')}</div>`)
  +`<div class="overflow-x-auto"><table class="w-full text-xs border-collapse"><thead class="bg-gold-100 text-brand-700 uppercase text-[11px]"><tr><th class="p-2 border border-slate-100 w-24">Hari</th><th class="p-2 border border-slate-100 w-24">Shift</th><th class="p-2 border border-slate-100">Standby</th><th class="p-2 border border-slate-100">By Appointment</th></tr></thead><tbody>${rows}</tbody></table></div>`)},
 dokter_absensi:db=>card(head('📋 Absensi Kehadiran Dokter','Pencatatan jam masuk dan keluar',addBtn('absensiDokter','Catat Kehadiran'))+tbl('absensiDokter',absCols('dokter'),F(db.absensiDokter))),
 perawat_data:db=>card(head('👩‍⚕️ Data Perawat Klinik','Daftar perawat asisten klinik gigi',addBtn('perawat','Tambah Perawat'))+tbl('perawat',[['ID',r=>`<b class="text-brand-600">${r.id}</b>`],['Nama',r=>`<b>${r.nama}</b>`],['Shift',r=>r.shift],['Phone',r=>r.phone],['Status',r=>bdg(r.status)]],F(db.perawat))),
 perawat_jadwal:db=>{const a=F(db.jadwalPerawat),y=pm.getFullYear(),m=pm.getMonth(),off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),td=today(),
  hd=head('🗓️ Jadwal Perawat','PG 1 = Admin, PG 2 = Asisten. Klik nama untuk edit, tukar shift, atau tandai tidak berangkat',addBtn('jadwalPerawat','Tambah Jadwal Perawat')),
  bar=`<div class="flex flex-wrap items-center gap-2 mb-4 text-xs"><button onclick="pmNav(-1)" class="ic text-brand-600"><i class="fa-solid fa-chevron-left"></i></button><b class="text-sm text-brand-700 w-36 text-center">${pm.toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</b><button onclick="pmNav(1)" class="ic text-brand-600"><i class="fa-solid fa-chevron-right"></i></button><button onclick="pmode=pmode==='kalender'?'tabel':'kalender';render()" class="btn-g ml-auto">${pmode==='kalender'?'Tampilan Tabel':'Tampilan Kalender'}</button><button onclick="importJadwal()" class="btn-g">Muat Jadwal Asli</button></div>`;
  if(pmode==='tabel')return card(hd+bar+tbl('jadwalPerawat',[['Tanggal',r=>r.tanggal],['Shift',r=>String(r.shift).split(' (')[0]],['Peran',r=>r.peran||'-'],['Perawat',r=>`<b>${r.perawat}</b>`],['Info',r=>bdg(r.info)],['Tukar Dengan',r=>r.tukarDengan||'-'],['Keterangan',r=>r.keterangan||'-']],a.filter(x=>x.tanggal.slice(0,7)===lokal(pm).slice(0,7)).sort((p,q)=>(p.tanggal+p.shift)>(q.tanggal+q.shift)?1:-1)));
  const chip=x=>`<button onclick="openForm('jadwalPerawat','${x.id}')" class="hover:underline ${x.info==='Tidak Berangkat'?'line-through text-red-600':x.info==='Tukar Shift'?'text-amber-700 font-bold':'font-semibold'}" title="${esc(x.info+(x.keterangan?': '+x.keterangan:''))}">${x.perawat}</button>`,
  tds=Array(off).fill('<td class="border border-slate-100 bg-slate-50"></td>');
  for(let d=1;d<=n;d++){const s=lokal(new Date(y,m,d)),sh=[1,2].map(k=>{const e=a.filter(x=>x.tanggal===s&&String(x.shift).startsWith('Shift '+k)),g=p=>e.filter(x=>String(x.peran||'').startsWith(p)).map(chip).join(', ')||'-';
    return `<div class="mt-1"><b class="text-brand-600">Shift ${k}</b><br><span class="text-slate-400">Admin</span> ${g('PG 1')}<br><span class="text-slate-400">Asisten</span> ${g('PG 2')}</div>`}).join('');
   tds.push(`<td class="border border-slate-100 p-2 align-top text-[11px] ${s===td?'bg-gold-100/70':''}"><div class="flex justify-between"><b class="${s===td?'text-brand-600':''}">${d}</b><button onclick="openForm('jadwalPerawat',null,{tanggal:'${s}'})" class="text-brand-600" title="Tambah"><i class="fa-solid fa-plus"></i></button></div>${sh}</td>`)}
  while(tds.length%7)tds.push('<td class="border border-slate-100 bg-slate-50"></td>');
  const rows=[];for(let i=0;i<tds.length;i+=7)rows.push(`<tr>${tds.slice(i,i+7).join('')}</tr>`);
  return card(hd+bar+`<div class="overflow-x-auto"><table class="w-full min-w-[820px] table-fixed border-collapse"><thead class="bg-gold-100 text-brand-700 text-[11px] uppercase"><tr>${['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'].map(h=>`<th class="p-2 border border-slate-100">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`)},
 perawat_absensi:db=>card(head('📋 Absensi Kehadiran Perawat','Pencatatan jam masuk dan keluar',addBtn('absensiPerawat','Catat Kehadiran'))+tbl('absensiPerawat',absCols('perawat'),F(db.absensiPerawat))),
 laporan_pendapatan:db=>{const a=F(db.transaksi);return card(head('📊 Laporan Akhir Full Pendapatan','Total transaksi lunas: '+rp(a.reduce((s,t)=>s+t.total,0)),`<button onclick="window.print()" class="btn-p"><i class="fa-solid fa-print mr-1"></i> Print Laporan</button>`)+tbl('transaksi',[['ID',r=>r.id],['Tanggal',r=>r.tgl],['Pasien',r=>r.pasien],['Dokter',r=>r.dokter],['Layanan',r=>r.layanan],['Total',r=>`<b>${rp(r.total)}</b>`],['Metode',r=>r.metode]],a,false))},
 laporan_absensi_dokter:rep('absensiDokter','Laporan Rekap Absensi Dokter','dokter'),
 laporan_absensi_perawat:rep('absensiPerawat','Laporan Rekap Absensi Perawat','perawat'),
 laporan_ringkasan:db=>{const t=db.transaksi.reduce((s,i)=>s+i.total,0),g=grp(db.transaksi,'layanan'),top=Object.keys(g).sort((a,b)=>g[b]-g[a])[0]||'-',h=db.absensiDokter.filter(x=>x.status==='Hadir').length;
  return card(head('📑 Ringkasan Laporan Eksekutif','Dihitung otomatis dari data terbaru')+`<div class="p-4 bg-gold-100/60 rounded-2xl text-xs space-y-2 text-brand-800"><p>• Total Pendapatan Operasional: <b>${rp(t)}</b> (${db.transaksi.length} transaksi)</p><p>• Layanan Terlaris: <b>${top}</b></p><p>• Pengeluaran Pembelian Obat: <b>${rp(db.pembelianObat.reduce((s,x)=>s+x.total,0))}</b></p><p>• Jumlah Pasien Terdaftar: <b>${db.pasien.length}</b></p><p>• Kehadiran Dokter: <b>${h} dari ${db.absensiDokter.length}</b> catatan absensi</p><p>• Jadwal Perawat Tukar Shift / Tidak Berangkat: <b>${db.jadwalPerawat.filter(x=>x.info!=='Jadwal Normal').length}</b></p></div>`)},
 statistik:()=>`<div class="bg-white p-5 rounded-3xl card-shadow"><h2 class="text-base font-extrabold">📈 Analisis & Statistik Operasional</h2></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4">${card('<h3 class="font-bold text-xs mb-3">Pendapatan per Layanan</h3><div class="h-56"><canvas id="c1"></canvas></div>')}${card('<h3 class="font-bold text-xs mb-3">Jumlah Tindakan per Dokter</h3><div class="h-56"><canvas id="c2"></canvas></div>')}</div>`,
 export:()=>`<div class="max-w-xl mx-auto">${card(head('📥 Export Data & Laporan','Unduh data ke format CSV (Excel)')+`<label class="lb">Pilih Data<select id="ex" class="inp">${[['pasien','Data Pasien'],['transaksi','Transaksi & Pendapatan'],['layanan','Layanan Gigi'],['dokter','Data Dokter'],['jadwalDokter','Jadwal Praktik Dokter'],['absensiDokter','Absensi Dokter'],['perawat','Data Perawat'],['jadwalPerawat','Jadwal Perawat'],['absensiPerawat','Absensi Perawat'],['pembelianObat','Pembelian Obat'],['reservasi','Reservasi']].map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select></label><button onclick="dlCSV()" class="btn-p w-full py-3 mt-4"><i class="fa-solid fa-file-excel mr-1"></i> Unduh File CSV</button>`)}</div>`,
 pengguna:db=>card(head('👤 Pengguna Akses Admin & Staf','')+tbl('pengguna',[['Username',r=>`<b class="text-brand-600">${r.username}</b>`],['Nama',r=>r.nama],['Role',r=>r.role],['Status',r=>bdg(r.status)]],F(db.pengguna),false)),
 notifikasi:db=>card(head('🔔 Pusat Notifikasi Klinik','')+`<div class="space-y-2">${F(db.notifikasi).map(n=>`<div class="p-4 rounded-2xl ${n.unread?'bg-brand-50 border border-brand-100':'bg-slate-50'} flex justify-between"><div><h4 class="font-extrabold text-xs">${n.judul}</h4><p class="text-xs text-slate-600 mt-0.5">${n.pesan}</p><span class="text-[10px] text-slate-400">${n.tgl}</span></div>${n.unread?'<span class="w-2 h-2 rounded-full bg-brand-600"></span>':''}</div>`).join('')||'<p class="text-slate-400 text-xs">Tidak ada notifikasi</p>'}</div>`),
 pengaturan:db=>{const p=db.pengaturan;return `<div class="max-w-xl mx-auto">${card(head('⚙️ Pengaturan Profil Klinik','')+`<form onsubmit="saveSet(event)" class="space-y-3">${[['namaKlinik','Nama Klinik'],['slogan','Slogan / Tagline'],['alamat','Alamat Lengkap'],['telepon','No Telepon / Kontak']].map(f=>`<label class="lb">${f[1]}<input name="${f[0]}" value="${esc(p[f[0]])}" class="inp"></label>`).join('')}<button class="btn-p w-full py-3">Simpan Perubahan</button></form>`)}</div>`}
};
const PH={reservasi:'reservasi',pendapatan_dokter:'pendapatan dokter',obat_beli:'pembelian obat',obat_rekap:'obat',pasien:'pasien',layanan:'layanan',transaksi:'transaksi',dokter_data:'dokter',dokter_jadwal:'jadwal dokter',dokter_absensi:'absensi dokter',perawat_data:'perawat',perawat_jadwal:'jadwal perawat',perawat_absensi:'absensi perawat',laporan_pendapatan:'laporan pendapatan',laporan_absensi_dokter:'absensi dokter',laporan_absensi_perawat:'absensi perawat',pengguna:'pengguna',notifikasi:'notifikasi'};
const mk=(id,c)=>{const e=$(id);if(!e)return;Chart.getChart(e)?.destroy();new Chart(e,c)};
const INIT={
 dashboard:db=>{const d=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);d.push(lokal(x))}
  const g=grp(db.transaksi,'tgl',t=>t.total),s=grp(db.transaksi,'layanan');
  mk('c1',{type:'line',data:{labels:d.map(x=>x.slice(5)),datasets:[{data:d.map(x=>g[x]||0),borderColor:'#6d0f26',backgroundColor:'rgba(217,185,138,.3)',fill:true,tension:.4,borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
  mk('c2',{type:'doughnut',data:{labels:Object.keys(s),datasets:[{data:Object.values(s),backgroundColor:COL}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}}}})},
 statistik:db=>{const g=grp(db.transaksi,'layanan',t=>t.total),k=grp(db.transaksi,'dokter');
  mk('c1',{type:'bar',data:{labels:Object.keys(g),datasets:[{label:'Pendapatan (Rp)',data:Object.values(g),backgroundColor:'#6d0f26'}]},options:{responsive:true,maintainAspectRatio:false}});
  mk('c2',{type:'pie',data:{labels:Object.keys(k),datasets:[{data:Object.values(k),backgroundColor:COL}]},options:{responsive:true,maintainAspectRatio:false}})}
};
function go(v){cur=v;Q='';$('gs').value='';
 document.querySelectorAll('#nav .on').forEach(e=>e.classList.remove('on'));
 const a=$('nav-'+v);if(a){a.classList.add('on');if(a.parentElement.classList.contains('sub'))a.parentElement.classList.remove('hidden')}
 render()}
function render(){const db=getDB(),g=$('gs');
 g.disabled=!PH[cur];g.placeholder=PH[cur]?'Cari '+PH[cur]+'...':'Pencarian tidak tersedia di halaman ini';
 $('content').innerHTML=V[cur](db);if(INIT[cur])INIT[cur](db);buildRight()}

// ===== KASIR, EXPORT, PENGATURAN =====
function calcTx(id){const l=getDB().layanan.find(x=>x.id===id);tx=l?l.harga:0;$('tx_tot').textContent=rp(tx)}
function prosesTx(e){e.preventDefault();if(!tx)return toast('Pilih layanan gigi terlebih dahulu!','warning');
 const db=getDB(),l=db.layanan.find(x=>x.id===$('tx_l').value);
 db.transaksi.unshift({id:'TRX-'+Date.now().toString().slice(-6),tgl:$('tx_t').value||today(),pasien:$('tx_p').value,dokter:$('tx_d').value,layanan:l.nama,total:tx,metode:document.querySelector('input[name=tx_m]:checked').value,status:'Lunas'});
 saveDB(db);tx=0;toast('Transaksi sukses!','success');render()}
function invoice(id){const db=getDB(),t=db.transaksi.find(x=>x.id===id),p=db.pengaturan;if(!t)return;
 const r=(a,b)=>`<div class="flex justify-between"><span class="text-slate-500">${a}</span><b>${b}</b></div>`;
 showModal(`<div class="text-xs max-w-sm mx-auto"><div class="text-center pb-3 border-b border-dashed border-slate-300"><img src="${LOGO}" class="w-14 h-14 rounded-full mx-auto mb-1"><h3 class="font-extrabold text-sm uppercase">${p.namaKlinik}</h3><p class="text-[10px] text-slate-500">${p.alamat}<br>Telp: ${p.telepon}</p></div>
 <div class="py-3 space-y-1 border-b border-dashed border-slate-300">${r('No Invoice',t.id)}${r('Tanggal',t.tgl)}${r('Pasien',t.pasien)}${r('Dokter',t.dokter)}</div>
 <div class="py-3 border-b border-dashed border-slate-300">${r(t.layanan,rp(t.total))}</div>
 <div class="py-3 space-y-1"><div class="flex justify-between text-sm font-extrabold"><span>TOTAL BAYAR</span><span class="text-brand-600">${rp(t.total)}</span></div>${r('Metode',t.metode)}</div>
 <p class="text-center text-[10px] text-slate-400">Terima kasih atas kunjungan Anda di ${p.namaKlinik}!</p>
 <div class="flex gap-2 pt-4"><button onclick="closeModal()" class="btn-g w-1/2">Tutup</button><button onclick="window.print()" class="btn-p w-1/2">Cetak Invoice</button></div></div>`)}
function dlCSV(){const t=$('ex').value,a=getDB()[t];if(!a.length)return toast('Data kosong','warning');
 const h=Object.keys(a[0]),q=v=>`"${String(v??'').replace(/"/g,'""')}"`,
 s='\ufeff'+[h.map(q).join(','),...a.map(o=>h.map(k=>q(o[k])).join(','))].join('\n'),l=document.createElement('a');
 l.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));l.download=`Laporan_Simply_Smiles_${t}.csv`;l.click();toast('File CSV berhasil diunduh!','success')}
function saveSet(e){e.preventDefault();const db=getDB();['namaKlinik','slogan','alamat','telepon'].forEach(k=>db.pengaturan[k]=e.target.elements[k].value);saveDB(db);toast('Pengaturan disimpan!','success')}
getDB();
</script>
</body>
